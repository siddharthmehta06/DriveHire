services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drivehire
      POSTGRES_PASSWORD: drivehire
      POSTGRES_DB: drivehire
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivehire -d drivehire"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://drivehire:drivehire@postgres:5432/drivehire?schema=public
      PORT: 4000
      NODE_ENV: development
      JWT_SECRET: local-development-only
      OTP_DEV_MODE: "true"
      ADMIN_REGISTRATION_CODE: ${ADMIN_REGISTRATION_CODE:-}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM: DriveHire <notifications@drivehire.local>
    ports:
      - "4000:4000"
    volumes:
      - vehicle-uploads:/app/server/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:4000
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - api

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: drivehire
      POSTGRES_PASSWORD: drivehire
      POSTGRES_DB: drivehire_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivehire -d drivehire_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  test:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql://drivehire:drivehire@postgres-test:5432/drivehire_test?schema=public
      NODE_ENV: test
      JWT_SECRET: test-only
    command:
      ["sh", "-c", "npm run test:server:migrations && npm run test:client"]
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  postgres-data:
  vehicle-uploads:
